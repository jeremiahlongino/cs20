<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe's Hotdog Stand - Part 2</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }
        .order-line {
            display: flex;
            justify-content: space-between;
            max-width: 300px;
        }
        .order-line.total {
            font-weight: bold;
            border-top: 1px solid #333;
            margin-top: 5px;
            padding-top: 5px;
        }
        .order-line.subtotal {
            font-weight: bold;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <h1> Joe's Hotdog Stand</h1>
        <div id="orderDetails"></div>
    </div>

    <script>
         alert("Welcome to Joe's Hotdog Stand!\n\n" +
              "MENU:\n" +
              "• Hotdog - $5.25\n" +
              "• French Fries - $3.75\n" +
              "• SODA - $2.50\n\n" +
              "SPECIALS:\n" +
              "• Joe's Meal Deal - $10.00 (1 hotdog, 1 fries, 1 soda)\n" +
              "• 10% discount on orders of $30 or more!!!!!!!");

        // constants array
        const itemPrices = {
            "Hotdogs": 5.25,
            "French Fries": 3.75,
            "Drinks": 2.50
        };

        // quantities array
        const itemQuants = {};

        const MEAL_DEAL = 10.00;
        const DISCOUNT_THRESHOLD = 30.00;
        const DISCOUNT_RATE = 0.10;
        const TAX = 0.0625;

        // loop to ask for everything
        for (let item in itemPrices) {

            let quantity = parseInt(prompt("How many " + item + " do you want?","0"))
            
            // any nones are turned to 0 same as before
            if (isNaN(quantity)) {
                quantity = 0;
            }
            
            // add quantities to second array
            itemQuants[item] = quantity;
        }

        function showMoney(amount) {
            // multiply by 100, round to nearest integer, then divide by 100
            let rounded = Math.round(amount * 100) / 100;
            
            // decimal part is always 2 digits
            let decimalPart = Math.round((rounded - Math.floor(rounded)) * 100);
            
            let decimalString = decimalPart.toString();
            if (decimalPart < 10) {
                decimalString = "0" + decimalString;
            }
            
            return Math.floor(rounded) + "." + decimalString;
        }


        

        let subtotal = 0;
        for (let item in itemPrices) {
            subtotal += itemPrices[item] * itemQuants[item];
        }

        // applies meal deal based off quantities
        let mealDeals = Math.min(
            itemQuants["hotdogs"],
            itemQuants["fries"],
            itemQuants["sodas"]
        );
        
        let mealDealDiscount = 0;
        if (mealDeals > 0) {
            
            let regularCost = mealDeals * (
                itemPrices["hotdogs"] + 
                itemPrices["fries"] + 
                itemPrices["sodas"]
            );

            let mealDealCost = mealDeals * MEAL_DEAL;
            mealDealDiscount = regularCost - mealDealCost;

            subtotal = subtotal - mealDealDiscount;
        }

        let subtotalBeforeDiscount = subtotal;

        // applies 10% discount if $30 or more
        let discountAmount = 0;
        if (subtotal >= DISCOUNT_THRESHOLD) {
            discountAmount = subtotal * DISCOUNT_RATE;
            subtotal = subtotal - discountAmount;
        }

        let subtotalAfterDiscount = subtotal;
        let taxAmount = subtotal * TAX;
        let finalTotal = subtotal + taxAmount;

        // displays order details
        let orderHTML = "<h2>Order Summary</h2>";
        
        for (let item in itemPrices) {
            let qty = itemQuants[item];
            orderHTML += '<div class="order-line">';
            orderHTML += '<span>' + item + ' (' + qty + ')</span>';
            orderHTML += '<span>$' + showMoney(itemPrices[item] * qty) + '</span>';
            orderHTML += '</div>';
        }


        if (mealDeals > 0) {
            orderHTML += '<div class="order-line discount">';
            orderHTML += '<span>Joe\'s Meal Deal Savings (' + mealDeals + ')</span>';
            orderHTML += '<span>-$' + showMoney(mealDealDiscount) + '</span>';
            orderHTML += '</div>';
        }
        
        orderHTML += '<div class="order-line subtotal">';
        orderHTML += '<span>Subtotal Before Discount</span>';
        orderHTML += '<span>$' + showMoney(subtotalBeforeDiscount) + '</span>';
        orderHTML += '</div>';
        
        if (discountAmount > 0) {
            orderHTML += '<div class="order-line discount">';
            orderHTML += '<span>10% Discount (orders $30+)</span>';
            orderHTML += '<span>-$' + showMoney(discountAmount) + '</span>';
            orderHTML += '</div>';
        }
        
        orderHTML += '<div class="order-line subtotal">';
        orderHTML += '<span>Subtotal After Discount</span>';
        orderHTML += '<span>$' + showMoney(subtotalAfterDiscount) + '</span>';
        orderHTML += '</div>';
        
        orderHTML += '<div class="order-line">';
        orderHTML += '<span>MA Sales Tax (6.25%)</span>';
        orderHTML += '<span>$' + showMoney(taxAmount) + '</span>';
        orderHTML += '</div>';
        
        orderHTML += '<div class="order-line total">';
        orderHTML += '<span>FINAL TOTAL</span>';
        orderHTML += '<span>$' + showMoney(finalTotal) + '</span>';
        orderHTML += '</div>';

        document.getElementById('orderDetails').innerHTML = orderHTML;
    </script>
</body>
</html>
