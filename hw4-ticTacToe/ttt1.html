<!DOCTYPE html>
<html>
<head>
<title> Tic-Tac-Toe Pt. 1</title>
<style>
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      width: fit-content;
    }
    .square{
        width: 100px;
        height: 100px;
        border: 2px solid black;
        display: inline-block;
        font-size: 60px;
        text-align: center;
        line-height: 100px;
        margin: 5px;
        cursor: pointer;
    }
    .square:hover {
      background-color: lightgray;
    }
    .board {
      width: 340px;
    }
</style>
</head>
<body>
  <div class="board">
    <div class="square"></div>
    <div class="square">O</div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square">X</div>
    <div class="square"></div>
    <div class="square">X</div>
  </div>
</body>
</html>
