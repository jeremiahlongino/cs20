<!DOCTYPE html>
<html>
<head>
<title> Tic-Tac-Toe Pt. 2</title>
<style>
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      width: fit-content;
    }
    .square{
        width: 100px;
        height: 100px;
        border: 2px solid;
        display: inline-block;
        font-size: 60px;
        text-align: center;
        line-height: 100px;
        margin: 5px;
        cursor: pointer;
    }
    .square:hover {
      background-color: lightgray;
    }
    .board {
      width: 340px;
    }
    #turn{
      border: 2px solid;
      padding-left: 120px;
      margin-bottom: 10px;
      width: 200px;
    }
    #win{
      border:2px solid; 
      padding-left: 80px;
      padding-right: 40px;
      margin-top: 20px;
      width: 200px;
    }
</style>
</head>
<body>
    
  <h1>Tic Tac Toe</h1>
  <div id="turn">Start Game</div> 
  <div class="board"> 
    <script>const NUM_SQUARES = 9;
        for (i=0; i<NUM_SQUARES; i++)
        {
            id = "sq" + i;
            document.write( "<div class='square' id='" + id + "'></div>" );
        }
    </script>
    </div>

    <div id="win"> Win Condition and Whatnot</div>

    <button onclick="GameStarts()">Start Game</button>
    

  <script>
    var currSymbol = "X";
    var active = false;

    function symbolPlace(num) {
      if (!active) return;
      var sq = document.getElementById("sq" + num);
      if (sq.innerHTML != "") return;

      alert("Placed at Square: " + num);

      sq.innerHTML = currSymbol;
      currSymbol = (currSymbol === "X") ? "O" : "X";
      document.getElementById("turn").innerHTML = currSymbol + "'s turn now";
    }

    function GameStarts() {
      currSymbol = Math.random() < 0.5 ? "X" : "O";
      active = true;

      for (var i = 0; i < 9; i++) {
        document.getElementById("sq" + i).innerHTML = "";
        document.getElementById("sq" + i).onclick = (function(n) {
          return function() { symbolPlace(n); };
        })(i);
      }

      document.getElementById("turn").innerHTML = currSymbol + "'s turn now";
    }
  </script>
</body>
</html>
