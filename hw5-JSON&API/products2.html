<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"   
	integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8="   
	crossorigin="anonymous">
 </script>
    <meta charset="UTF-8">      
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products2 - Button Display</title>
</head>

<style>
    #button {
        margin: 5px;
        padding: 10px;
        background-color: lightskyblue;
        color: white;
        border: black solid 1px;
        border-radius: 5px;
        cursor: pointer;
    }
    #button:hover {
        background-color: lightblue;
    }

    .square{
        border: 2px solid #333;
        border-radius: 8px;
        padding: 15px;
        margin: 10px;
        width: 250px;
        display: inline-block; 
        vertical-align: top;
        text-align: left;
        background-color: #f9f9f9;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }

    .square:hover {
      background-color: lightgray;
    }

    #loadProducts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
</style>
<body>
<h1 style="text-align: center;">Products2 - Load Products</h1>
<div style="text-align: center;">
    <button id="button">Load Products</button>
</div>
<div id="loadProducts"></div>

<script>
    $("#button").on("click", function() {
    $.getJSON("https://jeremiahlongino.github.io/cs20/hw5-JSON%26API/products.json", function(data) {
        // clears previous results
        $("#loadProducts").html(""); 

        data.forEach(function(product) {
            var productInfo = "<div class='square'>" + "<h3>" + product.name + "</h3>" +
                              "<p>" + product.description + "</p>" +
                              "<p><strong>Price: $</strong>" + product.price + "</p>" +
                              "<p><strong>Categories: </strong> " + product.categories.join(", ") + "</p>"+ "</div>";
            $("#loadProducts").append(productInfo);
        });
    });
});
</script>
</body>
